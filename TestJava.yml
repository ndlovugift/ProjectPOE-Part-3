name: TestJava

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download JUnit libraries
        run: |
          mkdir -p lib
          curl -sSL -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSL -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile source and quickchat tests
        run: |
          mkdir -p build/classes
          javac -d build/classes -cp "lib/*" $(find src/quickchat test/quickchat -name "*.java")

      - name: Run unit tests
        run: java -cp "build/classes:lib/*" org.junit.runner.JUnitCore quickchat.MessageTest
